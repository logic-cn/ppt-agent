    <rect x="0" y="0" width="820" height="410" rx="184" fill="url(#gloss)"/>
    <rect x="0" y="0" width="820" height="820" rx="184" fill="url(#gloss2)"/>

    <g fill="#ffffff">
      <rect x="180" y="216" width="460" height="312" rx="40"/>
      <rect x="390" y="528" width="40" height="54" rx="11"/>
      <rect x="310" y="582" width="200" height="26" rx="13"/>
    </g>
    <path d="M350 272 L350 472 L530 372 Z" fill="url(#bg)"/>
  </g>
