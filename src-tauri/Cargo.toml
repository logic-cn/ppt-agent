[package]
name = "ppt-agent"
version = "0.1.2"
description = "轻量级 AI PPT 工作站"
authors = ["PPT Agent"]
edition = "2021"
rust-version = "1.77"
# src/bin/llm_headless.rs（端侧实跑 harness 的无头推理侧）使 crate 有两个
# bin，tauri build 需要显式指定主二进制
default-run = "ppt-agent"

[lib]
name = "ppt_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
keyring = "3"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt", "sync", "fs", "io-util"] }
sha2 = "0.10"
fs2 = "0.4"
llama-cpp-2 = { version = "0.1", default-features = false, features = ["common"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
