[package]
name = "ppt-agent"
version = "0.1.0"
description = "轻量级 AI PPT 工作站"
authors = ["PPT Agent"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ppt_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
keyring = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
